name: update-topics

on:
  schedule:
    - cron: "5 * * * *"   # every hour at minute 5
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: roundtable-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update trending topics
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/update_topics.py
      - name: Commit result
        run: |
          git config user.name "roundtable-bot"
          git config user.email "roundtable-bot@users.noreply.github.com"
          git add docs/data/topics.json
          git diff --cached --quiet || git commit -m "Update topics $(date -u +%Y-%m-%d_%H:%M)"
          git pull --rebase
          git push
