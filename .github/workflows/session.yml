name: roundtable-session

on:
  schedule:
    # 03:00 and 15:00 UTC = 08:30 and 20:30 in Sri Lanka
    - cron: "0 3,15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: roundtable
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run one session
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/run_session.py
      - name: Commit result
        run: |
          git config user.name "roundtable-bot"
          git config user.email "roundtable-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "New session $(date -u +%Y-%m-%d_%H:%M)"
          git push
